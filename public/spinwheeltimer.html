<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spin Wheel - SpinWinToken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body {
    background:#000;
    color:#ffd700;
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    padding-bottom:90px;
  }

  .logo-row {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-top:20px;
  }

  .logo-icon { font-size:60px; }
  .logo-title { font-size:28px; font-weight:bold; }

  .top-row {
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:10px;
    width:90%;
    max-width:420px;
    margin:20px auto 0 auto;
  }

  .half-box {
    width:50%;
    display:flex;
  }

  .countdown-box {
    padding:20px;
    background:#111;
    border:1px solid #ffd700;
    border-radius:10px;
    width:100%;
    height:100%;
    box-sizing:border-box;
  }

  .countdown-title { font-size:20px; }
  .timer { font-size:32px; font-weight:bold; margin-top:10px; }
  .countdown-info { margin-top:10px; font-size:14px; }

  .icon-box {
    padding:20px;
    background:#111;
    border:1px solid #ffd700;
    border-radius:10px;
    width:100%;
    height:100%;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }

  .bingo-icon { font-size:50px; }
  .token-value { margin-top:10px; font-size:26px; font-weight:bold; }
  .token-small { font-size:12px; margin-top:2px; text-align:right; width:100%; color:#ffd700; }

  .pointer {
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:30px solid red;
    margin:0 auto;
    margin-top:18px;
  }

  canvas {
    margin-top:0px;
    background:#111;
    border:3px solid #ffd700;
    border-radius:50%;
  }

  #spin-results {
    margin-top:30px;
    font-size:40px;
    letter-spacing:12px;
  }

  #bingo-display {
    margin-top:20px;
    font-size:32px;
    color:#fff;
    text-align:center;
  }

  #bingo-date {
    margin-top:10px;
    font-size:20px;
    color:#ffd700;
    width:100%;
    text-align:left;
    padding-left:120px;
  }

  #bingo-extra {
    font-size:18px;
    color:#00ffea;
    text-align:left;
    padding-left:120px;
    margin-top:10px;
    line-height:26px;
  }

  #bingoSQL_display {
    font-size:18px;
    color:#00ffea;
    text-align:left;
    padding-left:120px;
    margin-top:15px;
    line-height:26px;
  }

  .icon-row {
    position:fixed;
    bottom:10px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:40px;
  }

  .icon-item {
    font-size:26px;
    opacity:0.9;
    cursor:pointer;
  }
</style>
</head>

<body>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  "https://xqtegtfaowplgyanpjsa.supabase.co",
  "sb_publishable_mBzrAtBTUaUBcXsGpGzB9Q_93NnWOZG"
);
</script>
  
<div class="box">
  <div class="title">Next Spin Starts In</div>
  <div id="timer" class="timer">Loading...</div>
</div>

<div class="box">
  <div class="title">SpinPoolToken</div>
  <div id="spinpooltoken" class="token">0.0000</div>
</div>

<script>
/* -------------------- SpinSQL AUTO-ROW -------------------- */

let globalNextSpinTime = null;
let timerLoaded = false;
let currentRowId = null;

async function loadSpinSQL() {
  const { data, error } = await supabaseClient
    .from("SpinSQL")
    .select("id, next_spin_time, reset_spinpooltoken")
    .order("next_spin_time", { ascending: false })
    .limit(1);

  if (error || !data || data.length === 0) {
    document.getElementById("timer").textContent = "Timer load error";
    return;
  }

  const row = data[0];

  currentRowId = row.id;
  globalNextSpinTime = new Date(row.next_spin_time);

  const dbToken = Number(row.reset_spinpooltoken).toFixed(4);
  document.getElementById("spinpooltoken").textContent = dbToken;

  timerLoaded = true;
}

/* -------------------- AUTO-UPDATE SPINSQL -------------------- */

async function updateSpinSQLWithNewTime() {
  const nowUTC = new Date();
  const newTime = new Date(nowUTC.getTime() + 5 * 60000); // +5 minutes

  await supabaseClient
    .from("SpinSQL")
    .update({
      next_spin_time: newTime.toISOString()
    })
    .eq("id", currentRowId);

  globalNextSpinTime = newTime;
  timerLoaded = true;
}

/* -------------------- TIMER WITH AUTO-RELOAD + AUTO-UPDATE -------------------- */

async function updateTimer() {
  if (!timerLoaded) {
    await loadSpinSQL();
    if (!timerLoaded) return;
  }

  const nowUTC = new Date();
  const diff = globalNextSpinTime - nowUTC;

  if (diff <= 0) {
    document.getElementById("timer").textContent = "0m 0s";

    // ⭐ Auto-update SpinSQL with new future time
    await updateSpinSQLWithNewTime();

    // ⭐ Auto-reload newest SpinSQL row
    timerLoaded = false;
    await loadSpinSQL();
    return;
  }

  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${minutes}m ${seconds}s`;
}

setInterval(updateTimer, 1000);
updateTimer();

</script>

</body>
</html>
