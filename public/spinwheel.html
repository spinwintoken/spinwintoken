<script>
/* WHEEL SLOTS */
const wheelSlots = [
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(65+i)),
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(97+i)),
  ...Array.from({length:10}, (_,i)=>String(i))
];

let spinPool = [...wheelSlots];
let results = [];
let spinning = false;
let pauseTimer = false;

/* RESTORE TOKEN + DATE */
const savedToken = localStorage.getItem("spinpooltokenValue");
if (savedToken) {
  document.getElementById("spinpooltoken").textContent = savedToken;
}

const savedDate = localStorage.getItem("lastSpinDate");
if (savedDate) {
  document.getElementById("bingo-date").textContent = "Date: " + savedDate;
}

/* CANVAS */
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const radius = 160;

/* DRAW WHEEL */
function drawWheel(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = i % 2 === 0 ? "#2a2a2a" : "#444";
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffd700";
    ctx.font = "14px Arial";
    ctx.fillText(wheelSlots[i], radius - 10, 5);
    ctx.restore();
  }
}

drawWheel();

/* FLASH */
function flashSlice(index) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  const start = index * slice;
  const end = start + slice;

  let flashOn = true;
  let count = 0;

  const flashInterval = setInterval(() => {
    count++;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = flashOn
      ? "rgba(255, 215, 0, 0.55)"
      : "rgba(255, 215, 0, 0.0)";
    ctx.fill();

    ctx.restore();
    flashOn = !flashOn;

    if (count >= 10) clearInterval(flashInterval);
  }, 100);
}

/* SPIN ONE */
function spinOne() {
  if (spinPool.length === 0) spinPool = [...wheelSlots];
  const index = Math.floor(Math.random() * spinPool.length);
  const value = spinPool[index];
  spinPool.splice(index, 1);
  return value;
}

/* ANIMATE SPIN */
function animateSpin(targetValue) {
  return new Promise(resolve => {

    const targetIndex = wheelSlots.indexOf(targetValue);
    const slice = (2 * Math.PI) / wheelSlots.length;

    const fullRotations = 3 * 2 * Math.PI;
    const targetAngle = fullRotations + (slice * targetIndex);

    const duration = 3000;
    const startTime = performance.now();

    try { document.getElementById("spinSound").play(); } catch(e){}

    function frame(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      const angle = targetAngle * progress;

      drawWheel(angle);

      if (progress >= 1) {
        try { document.getElementById("winSound").play(); } catch(e){}
        flashSlice(targetIndex);
        resolve();
      } else {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  });
}

/* DISPLAY RESULTS */
function updateResultsDisplay() {
  document.getElementById("spin-results").textContent =
    results.join("   ");
}

/* --------------------------------------------------
   REWARD DISTRIBUTION LOGIC
-------------------------------------------------- */

async function processRewards() {

  let spinpooltoken = Number(document.getElementById("spinpooltoken").textContent);

  const percent_18 = spinpooltoken * 0.18;
  const percent_15 = spinpooltoken * 0.15;
  const percent_12 = spinpooltoken * 0.12;
  const percent_9  = spinpooltoken * 0.09;
  const percent_6  = spinpooltoken * 0.06;
  const percent_3  = spinpooltoken * 0.03;
  const percent_7  = spinpooltoken * 0.07;

  const { data: rows, error } = await supabaseClient
    .from("BingoSQL")
    .select("id, crypto_wallet_id, rewardtoken");

  if (error) {
    console.log("READ ERROR:", error);
    return;
  }

  function countLeft(rows, index, char) {
    return rows.filter(r => r.crypto_wallet_id[index] === char).length;
  }

  function countRight(rows, index, char) {
    return rows.filter(r => r.crypto_wallet_id[r.crypto_wallet_id.length - 1 - index] === char).length;
  }

  async function addReward(indexLeft, charLeft, indexRight, charRight, pct) {
    for (const r of rows) {
      const leftMatch  = r.crypto_wallet_id[indexLeft] === charLeft;
      const rightMatch = r.crypto_wallet_id[r.crypto_wallet_id.length - 1 - indexRight] === charRight;

      if (leftMatch || rightMatch) {
        const newReward = (r.rewardtoken || 0) + pct;

        await supabaseClient
          .from("BingoSQL")
          .update({ rewardtoken: newReward })
          .eq("id", r.id);
      }
    }
  }

  /* 1st: A left, Z right */
  const c1_left  = countLeft(rows, 0, "A");
  const c1_right = countRight(rows, 0, "Z");
  const c1_total = c1_left + c1_right;

  let subtract_3 = 0;
  if (c1_total !== 0) {
    const pct_3 = percent_3 / c1_total;
    subtract_3 = percent_3;
    await addReward(0, "A", 0, "Z", pct_3);
  }

  /* 2nd: 2 left/right */
  const c2_left  = countLeft(rows, 1, "2");
  const c2_right = countRight(rows, 1, "2");
  const c2_total = c2_left + c2_right;

  let subtract_6 = 0;
  if (c2_total !== 0) {
    const pct_6 = percent_6 / c2_total;
    subtract_6 = percent_6;
    await addReward(1, "2", 1, "2", pct_6);
  }

  /* 3rd: Q left/right */
  const c3_left  = countLeft(rows, 2, "Q");
  const c3_right = countRight(rows, 2, "Q");
  const c3_total = c3_left + c3_right;

  let subtract_9 = 0;
  if (c3_total !== 0) {
    const pct_9 = percent_9 / c3_total;
    subtract_9 = percent_9;
    await addReward(2, "Q", 2, "Q", pct_9);
  }

  /* 4th: 7 left/right */
  const c4_left  = countLeft(rows, 3, "7");
  const c4_right = countRight(rows, 3, "7");
  const c4_total = c4_left + c4_right;

  let subtract_12 = 0;
  if (c4_total !== 0) {
    const pct_12 = percent_12 / c4_total;
    subtract_12 = percent_12;
    await addReward(3, "7", 3, "7", pct_12);
  }

  /* 5th: f left/right */
  const c5_left  = countLeft(rows, 4, "f");
  const c5_right = countRight(rows, 4, "f");
  const c5_total = c5_left + c5_right;

  let subtract_15 = 0;
  if (c5_total !== 0) {
    const pct_15 = percent_15 / c5_total;
    subtract_15 = percent_15;
    await addReward(4, "f", 4, "f", pct_15);
  }

  /* 6th: A left/right */
  const c6_left  = countLeft(rows, 5, "A");
  const c6_right = countRight(rows, 5, "A");
  const c6_total = c6_left + c6_right;

  let subtract_18 = 0;
  if (c6_total !== 0) {
    const pct_18 = percent_18 / c6_total;
    subtract_18 = percent_18;
    await addReward(5, "A", 5, "A", pct_18);
  }

  /* 7th: full match Af7Q2Z */
  const target = "Af7Q2Z";

  const c7_left  = rows.filter(r => r.crypto_wallet_id.startsWith(target)).length;
  const c7_right = rows.filter(r => r.crypto_wallet_id.endsWith(target)).length;
  const c7_total = c7_left + c7_right;

  let subtract_7 = 0;
  if (c7_total !== 0) {
    const pct_7 = percent_7 / c7_total;
    subtract_7 = percent_7;

    for (const r of rows) {
      const leftMatch  = r.crypto_wallet_id.startsWith(target);
      const rightMatch = r.crypto_wallet_id.endsWith(target);

      if (leftMatch || rightMatch) {
        const newReward = (r.rewardtoken || 0) + pct_7;

        await supabaseClient
          .from("BingoSQL")
          .update({ rewardtoken: newReward })
          .eq("id", r.id);
      }
    }
  }

  /* NEW SPINPOOLTOKEN */
  const newSpinpooltoken =
    1250
    - subtract_3
    - subtract_6
    - subtract_9
    - subtract_12
    - subtract_15
    - subtract_18
    - subtract_7;

  document.getElementById("spinpooltoken").textContent =
    newSpinpooltoken.toFixed(4);

  localStorage.setItem("spinpooltokenValue", newSpinpooltoken.toFixed(4));
}

/* RUN 6 SPINS */
async function runSpinWheel() {
  if (spinning) return;
  spinning = true;
  pauseTimer = true;

  results = [];
  updateResultsDisplay();

  document.getElementById("bingo-display").textContent = "BINGO:";

  for (let i = 0; i < 6; i++) {
    const value = spinOne();
    await animateSpin(value);
    results.unshift(value);
    updateResultsDisplay();
  }

  const bingoCode = results.join("");

  const spinDate = new Date().toString();
  localStorage.setItem("lastSpinDate", spinDate);
  document.getElementById("bingo-date").textContent = "Date: " + spinDate;

  document.getElementById("bingo-display").textContent =
    "BINGO: " + bingoCode;

  await processRewards();

  spinning = false;
  pauseTimer = false;
}

/* TIMER */
function updateTimer() {
  if (pauseTimer) return;

  const now = new Date();

  if (!window.testTargetTime) {
    window.testTargetTime = new Date(now.getTime() + (5 * 60 *
