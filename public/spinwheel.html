<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spin Wheel Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body {
    background:#000;
    color:#ffd700;
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    padding-bottom:90px;
  }

  .logo-row {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-top:20px;
  }

  .logo-icon { font-size:60px; }
  .logo-title { font-size:28px; font-weight:bold; }

  .top-row {
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:10px;
    width:90%;
    max-width:420px;
    margin:20px auto 0 auto;
  }

  .half-box {
    width:50%;
    display:flex;
  }

  .countdown-box,
  .icon-box {
    padding:20px;
    background:#111;
    border:1px solid #ffd700;
    border-radius:10px;
    width:100%;
    height:100%;
    box-sizing:border-box;
  }

  .countdown-title { font-size:20px; }
  .timer { font-size:32px; font-weight:bold; margin-top:10px; }
  .countdown-info { margin-top:10px; font-size:14px; }

  .bingo-icon { font-size:50px; }
  .token-value { margin-top:10px; font-size:26px; font-weight:bold; }
  .token-small { font-size:12px; margin-top:2px; text-align:right; width:100%; color:#ffd700; }
</style>
</head>

<body>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  "https://xqtegtfaowplgyanpjsa.supabase.co",
  "sb_publishable_mBzrAtBTUaUBcXsGpGzB9Q_93NnWOZG"
);

/* -------------------- TIMER VARIABLES -------------------- */
let globalNextSpinTime = null;
let timerLoaded = false;
let currentRowId = 1;   // ALWAYS id = 1
</script>

<div class="logo-row">
  <div class="logo-icon">🎡</div>
  <div class="logo-title">SPINWIN TOKEN</div>
</div>

<div class="top-row">
  <div class="half-box">
    <div class="countdown-box">
      <div class="countdown-title">Next Spin Starts In</div>
      <div id="timer" class="timer">Loading...</div>
      <div class="countdown-info">Test Mode: 5‑minute cycle (UTC)</div>
    </div>
  </div>

  <div class="half-box">
    <div class="icon-box">
      <div class="bingo-icon">🎯</div>
      <div id="spinpooltoken" class="token-value">0.0000</div>
      <div class="token-small">Token</div>
    </div>
  </div>
</div>

<script>
/* -------------------- LOAD SpinSQL (UTC) -------------------- */
async function loadSpinSQL() {
  const { data, error } = await supabaseClient
    .from("SpinSQL")
    .select("id, next_spin_time, reset_spinpooltoken")
    .eq("id", 1)
    .single();

  if (error || !data) {
    document.getElementById("timer").textContent = "Timer load error";
    return;
  }

  globalNextSpinTime = new Date(data.next_spin_time);

  const dbToken = Number(data.reset_spinpooltoken).toFixed(4);
  document.getElementById("spinpooltoken").textContent = dbToken;

  timerLoaded = true;
}

/* -------------------- UPDATE next_spin_time (+5 min UTC) -------------------- */
async function updateSpinSQLWithNewTime() {
  const nowUTC = new Date();
  const newTime = new Date(nowUTC.getTime() + 5 * 60000);

  await supabaseClient
    .from("SpinSQL")
    .update({ next_spin_time: newTime.toISOString() })
    .eq("id", 1);

  globalNextSpinTime = newTime;
  timerLoaded = true;
}

/* -------------------- MAIN UTC TIMER LOOP -------------------- */
async function updateTimer() {
  if (!timerLoaded) {
    await loadSpinSQL();
    if (!timerLoaded) return;
  }

  const nowUTC = new Date();
  const diff = globalNextSpinTime - nowUTC;

  if (diff <= 0) {
    document.getElementById("timer").textContent = "0m 0s";

    await updateSpinSQLWithNewTime();
    timerLoaded = false;
    await loadSpinSQL();
    return;
  }

  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${minutes}m ${seconds}s`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
