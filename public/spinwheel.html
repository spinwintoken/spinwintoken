<script>
const wheelSlots = [
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(65+i)),
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(97+i)),
  ...Array.from({length:10}, (_,i)=>String(i))
];

let spinPool = [...wheelSlots];
let results = [];
let spinning = false;
let pauseTimer = false;

const savedToken = localStorage.getItem("spinpooltokenValue");
if (savedToken) {
  document.getElementById("spinpooltoken").textContent = savedToken;
}

const savedDate = localStorage.getItem("lastSpinDate");
if (savedDate) {
  document.getElementById("bingo-date").textContent = "Date: " + savedDate;
}

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const radius = 160;

function drawWheel(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = i % 2 === 0 ? "#2a2a2a" : "#444";
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffd700";
    ctx.font = "14px Arial";
    ctx.fillText(wheelSlots[i], radius - 10, 5);
    ctx.restore();
  }
}

drawWheel();

function flashSlice(index) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  const start = index * slice;
  const end = start + slice;

  let flashOn = true;
  let count = 0;

  const flashInterval = setInterval(() => {
    count++;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = flashOn
      ? "rgba(255, 215, 0, 0.55)"
      : "rgba(255, 215, 0, 0.0)";
    ctx.fill();

    ctx.restore();
    flashOn = !flashOn;

    if (count >= 10) clearInterval(flashInterval);
  }, 100);
}

function spinOne() {
  if (spinPool.length === 0) spinPool = [...wheelSlots];
  const index = Math.floor(Math.random() * spinPool.length);
  const value = spinPool[index];
  spinPool.splice(index, 1);
  return value;
}

function animateSpin(targetValue) {
  return new Promise(resolve => {

    const targetIndex = wheelSlots.indexOf(targetValue);
    const slice = (2 * Math.PI) / wheelSlots.length;

    const fullRotations = 3 * 2 * Math.PI;
    const targetAngle = fullRotations + (slice * targetIndex);

    const duration = 3000;
    const startTime = performance.now();

    try { document.getElementById("spinSound").play(); } catch(e){}

    function frame(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      const angle = targetAngle * progress;

      drawWheel(angle);

      if (progress >= 1) {
        try { document.getElementById("winSound").play(); } catch(e){}
        flashSlice(targetIndex);
        resolve();
      } else {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  });
}

function updateResultsDisplay() {
  document.getElementById("spin-results").textContent =
    results.join("   ");
}

async function displayGroups() {

  const { data: rows, error } = await supabaseClient
    .from("BingoSQL")
    .select("crypto_wallet_id");

  if (error) return;

  function leftMatch(rows, index, char) {
    return rows.filter(r => r.crypto_wallet_id[index] === char)
               .map(r => r.crypto_wallet_id);
  }

  function rightMatch(rows, index, char) {
    return rows.filter(r => {
      const lastChar = r.crypto_wallet_id[r.crypto_wallet_id.length - 1 - index];
      return lastChar === char;
    }).map(r => r.crypto_wallet_id);
  }

  function fullLeft(rows, target) {
    return rows.filter(r => r.crypto_wallet_id.startsWith(target))
               .map(r => r.crypto_wallet_id);
  }

  function fullRight(rows, target) {
    return rows.filter(r => r.crypto_wallet_id.endsWith(target))
               .map(r => r.crypto_wallet_id);
  }

  /* 1st Position: Z */
  const g1_left = leftMatch(rows, 0, "Z");
  const g1_right = rightMatch(rows, 0, "Z");
  document.getElementById("g1_left").textContent = "Left Z: " + (g1_left.length ? g1_left.join(", ") : "none");
  document.getElementById("g1_right").textContent = "Right Z: " + (g1_right.length ? g1_right.join(", ") : "none");
  document.getElementById("g1_total").textContent = "Total Z: " + (g1_left.length + g1_right.length);

  document.getElementById("g3_left").textContent = "Left Q: " + (g3_left.length ? g3_left.join(", ") : "none");

  document.getElementById("g3_total").textContent = "Total Q: " + (g3_left.length + g3_right.length);

  /* 4th Position: 7 */
  const g4_left = leftMatch(rows, 3, "7");

  document.getElementById("g4_left").textContent = "Left 7: " + (g4_left.length ? g4_left.join(", ") : "none");
  document.getElementById("g4_right").textContent = "Right 7: " + (g4_right.length ? g4_right.join(", ") : "none");
  document.getElementById("g4_total").textContent = "Total 7: " + (g4_left.length + g4_right.length);

  /* 5th Position: f */

  document.getElementById("g5_right").textContent = "Right f: " + (g5_right.length ? g5_right.join(", ") : "none");
  document.getElementById("g5_total").textContent = "Total f: " + (g5_left.length + g5_right.length);

  /* 6th Position: A */
  const g6_left = leftMatch(rows, 5, "A");
  const g6_right = rightMatch(rows, 5, "A");

/* RUN 6 SPINS */
async function runSpinWheel() {
  if (spinning) return;
