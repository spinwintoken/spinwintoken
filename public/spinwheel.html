<body>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  "https://xqtegtfaowplgyanpjsa.supabase.co",
  "sb_publishable_mBzrAtBTUaUBcXsGpGzB9Q_93NnWOZG"

</script>

  <div class="icon-item" onclick="location.href='profile.html'">🧑</div>
</div>

<script>
const wheelSlots = [
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(65+i)),
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(97+i)),
  ...Array.from({length:10}, (_,i)=>String(i))
];

let spinPool = [...wheelSlots];
let results = [];
let spinning = false;
let pauseTimer = false;

const savedToken = localStorage.getItem("spinpooltokenValue");
if (savedToken) {
  document.getElementById("spinpooltoken").textContent = savedToken;
}

const savedDate = localStorage.getItem("lastSpinDate");
if (savedDate) {
  document.getElementById("bingo-date").textContent = "Date: " + savedDate;
}

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const radius = 160;

function drawWheel(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = i % 2 === 0 ? "#2a2a2a" : "#444";
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffd700";
    ctx.font = "14px Arial";
    ctx.fillText(wheelSlots[i], radius - 10, 5);
    ctx.restore();
  }
}

drawWheel();

function updateResultsDisplay() {
  document.getElementById("spin-results").textContent =
    results.join("   ");
}

function spinOne() {
  if (spinPool.length === 0) spinPool = [...wheelSlots];
  const index = Math.floor(Math.random() * spinPool.length);
  const value = spinPool[index];
  spinPool.splice(index, 1);
  return value;
}

function animateSpin(targetValue) {
  return new Promise(resolve => {

    const targetIndex = wheelSlots.indexOf(targetValue);
    const slice = (2 * Math.PI) / wheelSlots.length;

    const fullRotations = 3 * 2 * Math.PI;
    const targetAngle = fullRotations + (slice * targetIndex);

    const duration = 3000;
    const startTime = performance.now();

    function frame(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      const angle = targetAngle * progress;

      drawWheel(angle);

      if (progress >= 1) {
        flashSlice(targetIndex);
        resolve();
      } else {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  });
}

function flashSlice(index) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  const start = index * slice;
  const end = start + slice;

  let flashOn = true;
  let count = 0;

  const flashInterval = setInterval(() => {
    count++;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = flashOn
      ? "rgba(255, 215, 0, 0.55)"
      : "rgba(255, 215, 0, 0.0)";
    ctx.fill();

    ctx.restore();
    flashOn = !flashOn;

    if (count >= 10) clearInterval(flashInterval);
  }, 100);
}

/* RUN 6 SPINS + percent_3 logic */
async function runSpinWheel() {
  if (spinning) return;
  spinning = true;
  pauseTimer = true;

  results = [];
  updateResultsDisplay();

  document.getElementById("bingo-display").textContent = "BINGO:";
  document.getElementById("bingoSQL_display").innerHTML = "";
  document.getElementById("bingo-extra").innerHTML = "";   // NEW RESET

  for (let i = 0; i < 6; i++) {
    const value = spinOne();
    await animateSpin(value);
    results.unshift(value);
    updateResultsDisplay();
  }

  const bingoCode = results.join("");
  const matchChar = bingoCode[0];  // FIRST bingo character

  const spinDate = new Date().toString();
  localStorage.setItem("lastSpinDate", spinDate);
  document.getElementById("bingo-date").textContent = "Date: " + spinDate;

  document.getElementById("bingo-display").textContent =
    "BINGO: " + bingoCode;

  /* percent_3 logic: spinpooltoken × 3% */
  const spinpooltoken = Number(document.getElementById("spinpooltoken").textContent);
  const percent_3 = spinpooltoken * 0.03;

  /* READ BingoSQL */
  const { data: rows, error } = await supabaseClient
    .from("BingoSQL")
    .select("id, crypto_wallet_id");

  if (error || !rows) {
    document.getElementById("bingoSQL_display").innerHTML =
      "ERROR reading BingoSQL.";
    spinning = false;
    pauseTimer = false;
    return;
  }

  /* MATCH LEFT */
  const leftMatches = rows.filter(r => r.crypto_wallet_id[0] === matchChar);

  /* MATCH RIGHT */
  const rightMatches = rows.filter(r => {
    const last = r.crypto_wallet_id[r.crypto_wallet_id.length - 1];
    return last === matchChar;
  });

  /* COUNTS */
  const first_left_count = leftMatches.length;
  const first_right_count = rightMatches.length;

  /* NEW DISPLAY BELOW DATE */
  document.getElementById("bingo-extra").innerHTML =
    "<strong>1st_left_count:</strong> " + first_left_count + "<br>" +
    "<strong>1st_right_count:</strong> " + first_right_count + "<br><br>";

  /* pct_3 calculation */
  let pct_3 = 0;
  if (first_left_count + first_right_count !== 0) {
    pct_3 = percent_3 / (first_left_count + first_right_count);
  }

  /* DISPLAY crypto_wallet_id + pct_3 */
  let output = "";
  output += "<strong>Bingo match character:</strong> " + matchChar + "<br><br>";

  output += "<strong>First char on the left = " + matchChar + ":</strong><br>";
  output += first_left_count
    ? leftMatches.map(r => r.crypto_wallet_id + " → pct_3 = " + pct_3.toFixed(3)).join("<br>")
    : "none";
  output += "<br><br>";

  output += "<strong>Last char on the right = " + matchChar + ":</strong><br>";
  output += first_right_count
    ? rightMatches.map(r => r.crypto_wallet_id + " → pct_3 = " + pct_3.toFixed(3)).join("<br>")
    : "none";
  output += "<br>";

  document.getElementById("bingoSQL_display").innerHTML = output;

  /* ACTION 12 — UPDATE BingoSQL pct_3 for all matches */
  if (pct_3 > 0) {

    const updatePromises = [];   // NEW EXPLANATION BELOW

    /* LEFT updates */
    leftMatches.forEach(r => {
      updatePromises.push(
        supabaseClient
          .from("BingoSQL")
          .update({ pct_3: pct_3 })
          .eq("id", r.id)
      );
    });

    /* NEW DISPLAY LEFT SUCCESS */
    document.getElementById("bingo-extra").innerHTML +=
      "<strong>LEFT update:</strong> " + leftMatches.length + " rows updated<br>";

    /* RIGHT updates */
    rightMatches.forEach(r => {
      updatePromises.push(
        supabaseClient
          .from("BingoSQL")
          .update({ pct_3: pct_3 })
          .eq("id", r.id)
      );
    });

    /* NEW DISPLAY RIGHT SUCCESS */
    document.getElementById("bingo-extra").innerHTML +=
      "<strong>RIGHT update:</strong> " + rightMatches.length + " rows updated<br>";

    await Promise.all(updatePromises);
  }

  spinning = false;
  pauseTimer = false;
}

function updateTimer() {
  if (pauseTimer) return;

  const now = new Date();

  if (!window.testTargetTime) {
    window.testTargetTime = new Date(now.getTime() + (5 * 60 * 1000));
  }

  const diff = window.testTargetTime - now;

  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("timer").textContent =
    `${minutes}m ${seconds}s`;

  if (diff <= 1000) {
    runSpinWheel();
    window.testTargetTime = new Date(new Date().getTime() + (5 * 60 * 1000));
  }
}

setInterval(updateTimer, 1000);
updateTimer();

</script>
