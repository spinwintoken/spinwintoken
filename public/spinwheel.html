<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spin Wheel - SpinWinToken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body {
    background:#000;
    color:#ffd700;
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    padding-bottom:90px;
  }

  .logo-row {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin-top:20px;
  }

  .logo-icon { font-size:60px; }
  .logo-title { font-size:28px; font-weight:bold; }

  .top-row {
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:10px;
    width:90%;
    max-width:420px;
    margin:20px auto 0 auto;
  }

  .half-box {
    width:50%;
    display:flex;
  }

  .countdown-box,
  .icon-box {
    padding:20px;
    background:#111;
    border:1px solid #ffd700;
    border-radius:10px;
    width:100%;
    height:100%;
    box-sizing:border-box;
  }

  .countdown-title { font-size:20px; }
  .timer { font-size:32px; font-weight:bold; margin-top:10px; }
  .countdown-info { margin-top:10px; font-size:14px; }

  .bingo-icon { font-size:50px; }
  .token-value { margin-top:10px; font-size:26px; font-weight:bold; }
  .token-small { font-size:12px; margin-top:2px; text-align:right; width:100%; color:#ffd700; }

  .pointer {
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:30px solid red;
    margin:0 auto;
    margin-top:18px;
  }

  .wheel-center {
    display:flex;
    justify-content:center;
    margin-top:10px;
  }

  canvas {
    background:#111;
    border:3px solid #ffd700;
    border-radius:50%;
  }

  #spin-results {
    margin-top:30px;
    font-size:40px;
    letter-spacing:12px;
  }

  #bingo-display {
    margin-top:20px;
    font-size:32px;
    color:#fff;
    text-align:center;
  }

  #bingo-date {
    margin-top:10px;
    font-size:20px;
    color:#ffd700;
    width:100%;
    text-align:left;
    padding-left:120px;
  }

  #bingo-extra {
    font-size:18px;
    color:#00ffea;
    text-align:left;
    padding-left:120px;
    margin-top:10px;
    line-height:26px;
  }

  #bingoSQL_display {
    font-size:18px;
    color:#00ffea;
    text-align:left;
    padding-left:120px;
    margin-top:15px;
    line-height:26px;
  }

  .icon-row {
    position:fixed;
    bottom:10px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:40px;
  }

  .icon-item {
    font-size:26px;
    opacity:0.9;
    cursor:pointer;
  }
</style>
</head>

<body>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  "https://xqtegtfaowplgyanpjsa.supabase.co",
  "sb_publishable_mBzrAtBTUaUBcXsGpGzB9Q_93NnWOZG"
);

/* GLOBAL SPIN ROW VARIABLES */
let globalNextSpinTime = null;
let timerLoaded = false;
let currentRowId = null;
let currentBingoCode = null;
let currentResetToken = null;

/* LOAD NEXT GLOBAL SPIN ROW FROM SpinSQL */
async function loadSpinSQL() {
  const nowUTC = new Date().toISOString();

  const { data, error } = await supabaseClient
    .from("SpinSQL")
    .select("id, next_spin_time, bingo_code, reset_token")
    .gt("next_spin_time", nowUTC)
    .order("next_spin_time", { ascending: true })
    .limit(1);

  if (error || !data || data.length === 0) {
    document.getElementById("timer").textContent = "No more spins";
    timerLoaded = false;
    return;
  }

  const row = data[0];

  currentRowId = row.id;
  globalNextSpinTime = new Date(row.next_spin_time);
  currentBingoCode = row.bingo_code;
  currentResetToken = row.reset_token;

  if (currentResetToken != null) {
    document.getElementById("spinpooltoken").textContent =
      Number(currentResetToken).toFixed(4);
  }

  timerLoaded = true;
}

/* TIMER USING GLOBAL ROWS (NO DB WRITES) */
async function updateTimer() {
  if (!timerLoaded) {
    await loadSpinSQL();
    if (!timerLoaded) return;
  }

  const nowUTC = new Date();
  const diff = globalNextSpinTime - nowUTC;

  if (diff <= 0) {
    document.getElementById("timer").textContent = "0m 0s";

    await runSpinWheel();

    timerLoaded = false;
    await loadSpinSQL();

    return;
  }

  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${minutes}m ${seconds}s`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
