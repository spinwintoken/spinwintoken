<script>
const wheelSlots = [
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(65+i)),
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(97+i)),
  ...Array.from({length:10}, (_,i)=>String(i))
];

let spinPool = [...wheelSlots];
let results = [];
let spinning = false;
let pauseTimer = false;

const savedToken = localStorage.getItem("spinpooltokenValue");
if (savedToken) {
  document.getElementById("spinpooltoken").textContent = savedToken;
}

const savedDate = localStorage.getItem("lastSpinDate");
if (savedDate) {
  document.getElementById("bingo-date").textContent = "Date: " + savedDate;
}

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const radius = 160;

function drawWheel(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = i % 2 === 0 ? "#2a2a2a" : "#444";
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffd700";
    ctx.font = "14px Arial";
    ctx.fillText(wheelSlots[i], radius - 10, 5);
    ctx.restore();
  }
}

drawWheel();

function updateResultsDisplay() {
  document.getElementById("spin-results").textContent =
    results.join("   ");
}

function spinOne() {
  if (spinPool.length === 0) spinPool = [...wheelSlots];
  const index = Math.floor(Math.random() * spinPool.length);
  const value = spinPool[index];
  spinPool.splice(index, 1);
  return value;
}

function animateSpin(targetValue) {
  return new Promise(resolve => {

    const targetIndex = wheelSlots.indexOf(targetValue);
    const slice = (2 * Math.PI) / wheelSlots.length;

    const fullRotations = 3 * 2 * Math.PI;
    const targetAngle = fullRotations + (slice * targetIndex);

    const duration = 3000;
    const startTime = performance.now();

    function frame(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      const angle = targetAngle * progress;

      drawWheel(angle);

      if (progress >= 1) {
        flashSlice(targetIndex);
        resolve();
      } else {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  });
}

function flashSlice(index) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  const start = index * slice;
  const end = start + slice;

  let flashOn = true;
  let count = 0;

  const flashInterval = setInterval(() => {
    count++;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = flashOn
      ? "rgba(255, 215, 0, 0.55)"
      : "rgba(255, 215, 0, 0.0)";
    ctx.fill();

    ctx.restore();
    flashOn = !flashOn;

    if (count >= 10) clearInterval(flashInterval);
  }, 100);
}

  document.getElementById("bingo-extra").innerHTML = "";

    const value = spinOne();
    await animateSpin(value);
    results.unshift(value);
    updateResultsDisplay();

  });

  }

  if (second_count === 0)  spinpool_remaining_percent += 0.06;
  if (third_count === 0)   spinpool_remaining_percent += 0.09;
  if (fourth_count === 0)  spinpool_remaining_percent += 0.12;
  if (fifth_count === 0)   spinpool_remaining_percent += 0.15;
  if (sixth_count === 0)   spinpool_remaining_percent += 0.18;
  if (seventh_count === 0) spinpool_remaining_percent += 0.07;

/* -------------------- GLOBAL UTC TIMER (reads SpinSQL.next_spin_time) -------------------- */

let globalNextSpinTime = null;
let timerLoaded = false;

async function loadSpinSQL() {
  const { data, error } = await supabaseClient
    .from("SpinSQL")
    .select("next_spin_time, reset_spinpooltoken")
    .eq("id", 1)
    .single();

  if (error || !data) {
    document.getElementById("timer").textContent = "Timer load error";
    return;
  }

  globalNextSpinTime = new Date(data.next_spin_time); // UTC timestamptz
  timerLoaded = true;

  // Also sync displayed token with DB reset_spinpooltoken
  if (data.reset_spinpooltoken !== null && data.reset_spinpooltoken !== undefined) {
    document.getElementById("spinpooltoken").textContent =
      Number(data.reset_spinpooltoken).toFixed(3);
  }
}

async function updateTimer() {
  if (pauseTimer) return;

  if (!timerLoaded) {
    await loadSpinSQL();
    if (!timerLoaded) return;
  }

  const nowUTC = new Date(); // JS Date internally UTC
  const diff = globalNextSpinTime - nowUTC;

  if (diff <= 0) {
    document.getElementById("timer").textContent = "0m 0s";

    if (!spinning) {
      await runSpinWheel();   // updates SpinSQL with new UTC time + reset token
      await loadSpinSQL();    // reload new next_spin_time
    }

    return;
  }

  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${minutes}m ${seconds}s`;
}

setInterval(updateTimer, 1000);
updateTimer();
