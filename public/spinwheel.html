<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spin Wheel</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 0;
  }

  .block {
    background: #ffffff;
    padding: 18px;
    margin: 14px;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }

  h2 {
    margin-top: 0;
    font-size: 1.2rem;
    font-weight: 600;
  }

  p {
    margin: 6px 0;
    font-size: 1rem;
  }

  #spinButton {
    width: 100%;
    padding: 14px;
    font-size: 1.2rem;
    border-radius: 10px;
    border: none;
    background: #4CAF50;
    color: white;
    cursor: pointer;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- SPINPOOLTOKEN DISPLAY BLOCK -->
<div class="block">
  <h2>🎰 Spin Pool Token</h2>
  <p id="spinpooltoken_icon">1250.0000</p>
</div>

<!-- SPIN BUTTON -->
<div class="block">
  <button id="spinButton">SPIN</button>
</div>

<script>
// --------------------------------------------------
// SUPABASE CLIENT
// --------------------------------------------------
const supabase = window.supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_ANON_KEY"
);

// --------------------------------------------------
// MAIN REWARD LOGIC
// --------------------------------------------------
async function processBingoRewards(spinpooltoken) {

  // Percent values
  const percent_18 = spinpooltoken * 0.18;
  const percent_15 = spinpooltoken * 0.15;
  const percent_12 = spinpooltoken * 0.12;
  const percent_9  = spinpooltoken * 0.09;
  const percent_6  = spinpooltoken * 0.06;
  const percent_3  = spinpooltoken * 0.03;
  const percent_7  = spinpooltoken * 0.07;

  // --------------------------------------------------
  // READ BingoSQL
  // --------------------------------------------------
  const { data: rows, error } = await supabase
    .from("BingoSQL")
    .select("id, crypto_wallet_id, rewardtoken");

  if (error) {
    console.log("Read error:", error);
    return;
  }

  // --------------------------------------------------
  // Helper functions
  // --------------------------------------------------
  function countLeft(rows, index, char) {
    return rows.filter(r => r.crypto_wallet_id[index] === char).length;
  }

  function countRight(rows, index, char) {
    return rows.filter(r => r.crypto_wallet_id[r.crypto_wallet_id.length - 1 - index] === char).length;
  }

  async function addRewardToMatches(indexLeft, charLeft, indexRight, charRight, pct) {
    for (const r of rows) {
      const leftMatch  = r.crypto_wallet_id[indexLeft] === charLeft;
      const rightMatch = r.crypto_wallet_id[r.crypto_wallet_id.length - 1 - indexRight] === charRight;

      if (leftMatch || rightMatch) {
        const newReward = (r.rewardtoken || 0) + pct;

        await supabase
          .from("BingoSQL")
          .update({ rewardtoken: newReward })
          .eq("id", r.id);
      }
    }
  }

  // --------------------------------------------------
  // 1st position: A (left) and Z (right)
  // --------------------------------------------------
  const c1_left  = countLeft(rows, 0, "A");
  const c1_right = countRight(rows, 0, "Z");
  const c1_total = c1_left + c1_right;

  let subtract_3 = 0;
  if (c1_total !== 0) {
    const pct_3 = percent_3 / c1_total;
    subtract_3 = percent_3;
    await addRewardToMatches(0, "A", 0, "Z", pct_3);
  }

  // --------------------------------------------------
  // 2nd position: 2 (left) and 2 (right)
  // --------------------------------------------------
  const c2_left  = countLeft(rows, 1, "2");
  const c2_right = countRight(rows, 1, "2");
  const c2_total = c2_left + c2_right;

  let subtract_6 = 0;
  if (c2_total !== 0) {
    const pct_6 = percent_6 / c2_total;
    subtract_6 = percent_6;
    await addRewardToMatches(1, "2", 1, "2", pct_6);
  }

  // --------------------------------------------------
  // 3rd position: Q (left) and Q (right)
  // --------------------------------------------------
  const c3_left  = countLeft(rows, 2, "Q");
  const c3_right = countRight(rows, 2, "Q");
  const c3_total = c3_left + c3_right;

  let subtract_9 = 0;
  if (c3_total !== 0) {
    const pct_9 = percent_9 / c3_total;
    subtract_9 = percent_9;
    await addRewardToMatches(2, "Q", 2, "Q", pct_9);
  }

  // --------------------------------------------------
  // 4th position: 7 (left) and 7 (right)
  // --------------------------------------------------
  const c4_left  = countLeft(rows, 3, "7");
  const c4_right = countRight(rows, 3, "7");
  const c4_total = c4_left + c4_right;

  let subtract_12 = 0;
  if (c4_total !== 0) {
    const pct_12 = percent_12 / c4_total;
    subtract_12 = percent_12;
    await addRewardToMatches(3, "7", 3, "7", pct_12);
  }

  // --------------------------------------------------
  // 5th position: f (left) and f (right)
  // --------------------------------------------------
  const c5_left  = countLeft(rows, 4, "f");
  const c5_right = countRight(rows, 4, "f");
  const c5_total = c5_left + c5_right;

  let subtract_15 = 0;
  if (c5_total !== 0) {
    const pct_15 = percent_15 / c5_total;
    subtract_15 = percent_15;
    await addRewardToMatches(4, "f", 4, "f", pct_15);
  }

  // --------------------------------------------------
  // 6th position: A (left) and A (right)
  // --------------------------------------------------
  const c6_left  = countLeft(rows, 5, "A");
  const c6_right = countRight(rows, 5, "A");
  const c6_total = c6_left + c6_right;

  let subtract_18 = 0;
  if (c6_total !== 0) {
    const pct_18 = percent_18 / c6_total;
    subtract_18 = percent_18;
    await addRewardToMatches(5, "A", 5, "A", pct_18);
  }

  // --------------------------------------------------
  // 7th position: full match Af7Q2Z
  // --------------------------------------------------
  const target = "Af7Q2Z";

  const c7_left  = rows.filter(r => r.crypto_wallet_id.startsWith(target)).length;
  const c7_right = rows.filter(r => r.crypto_wallet_id.endsWith(target)).length;
  const c7_total = c7_left + c7_right;

  let subtract_7 = 0;
  if (c7_total !== 0) {
    const pct_7 = percent_7 / c7_total;
    subtract_7 = percent_7;

    for (const r of rows) {
      const leftMatch  = r.crypto_wallet_id.startsWith(target);
      const rightMatch = r.crypto_wallet_id.endsWith(target);

      if (leftMatch || rightMatch) {
        const newReward = (r.rewardtoken || 0) + pct_7;

        await supabase
          .from("BingoSQL")
          .update({ rewardtoken: newReward })
          .eq("id", r.id);
      }
    }
  }

  // --------------------------------------------------
  // NEW SPINPOOLTOKEN
  // --------------------------------------------------
  const newSpinpooltoken =
    1250
    - subtract_3
    - subtract_6
    - subtract_9
    - subtract_12
    - subtract_15
    - subtract_18
    - subtract_7;

  // Display in icon block
  document.getElementById("spinpooltoken_icon").innerText =
    newSpinpooltoken.toFixed(4);
}

// --------------------------------------------------
// SPIN BUTTON CLICK
// --------------------------------------------------
document.getElementById("spinButton").addEventListener("click", () => {
  let spinpooltoken = 1250;
  processBingoRewards(spinpooltoken);
});
</script>

</body>
</html>
