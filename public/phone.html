<style>
  body {

  .countdown-box {

  .countdown-title { font-size: 22px; }

  .icon-box {

  canvas {

  #spin-results {

<script>
/* INIT SUPABASE */
const { createClient } = supabase;
const supabaseClient = createClient(
  "https://xqtegtfaowplgyanpjsa.supabase.co",
  "sb_publishable_mBzrAtBTUaUBcXsGpGzB9Q_93NnWOZG"
);

/* GLOBAL VARIABLES */
let globalNextSpinTime = null;
let timerLoaded = false;
let currentBingoCode = null;
let currentResetToken = null;
let spinning = false;
let results = [];

/* RESTORE SAVED DATE */
const savedDate = localStorage.getItem("lastSpinDate");
if (savedDate) {
  document.getElementById("bingo-date").textContent = "Date: " + savedDate;
}

/* 62 CHARACTER WHEEL */
const wheelSlots = [
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(65+i)),
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(97+i)),
  ...Array.from({length:10}, (_,i)=>String(i))
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const radius = 160;

/* DRAW WHEEL */
function drawWheel(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = i % 2 === 0 ? "#2a2a2a" : "#444";
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffd700";
    ctx.font = "14px Arial";
    ctx.fillText(wheelSlots[i], radius - 10, 5);
    ctx.restore();
  }
}

drawWheel();

/* FLASH */
function flashSlice(index) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  const start = index * slice;
  const end = start + slice;

  let flashOn = true;
  let count = 0;

  const flashInterval = setInterval(() => {
    count++;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = flashOn
      ? "rgba(255, 215, 0, 0.55)"
      : "rgba(255, 215, 0, 0.0)";
    ctx.fill();

    ctx.restore();
    flashOn = !flashOn;

    if (count >= 10) clearInterval(flashInterval);
  }, 100);
}

/* ANIMATE SPIN */
function animateSpin(targetValue) {
  return new Promise(resolve => {

    const targetIndex = wheelSlots.indexOf(targetValue);
    if (targetIndex === -1) {
      resolve();
      return;
    }

    const slice = (2 * Math.PI) / wheelSlots.length;

    const fullRotations = 3 * 2 * Math.PI;
    const targetAngle = fullRotations + (slice * targetIndex);

    const duration = 3000;
    const startTime = performance.now();

    function frame(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      const angle = targetAngle * progress;

      drawWheel(angle);

      if (progress >= 1) {
        flashSlice(targetIndex);
        resolve();
      } else {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  });
}

/* FORMAT DATE */
function formatReadableUTC() {
  const d = new Date();

  const weekdays = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months   = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const weekday = weekdays[d.getUTCDay()];
  const month   = months[d.getUTCMonth()];
  const day     = String(d.getUTCDate()).padStart(2, "0");
  const year    = d.getUTCFullYear();

  const hour    = String(d.getUTCHours()).padStart(2, "0");
  const minute  = String(d.getUTCMinutes()).padStart(2, "0");
  const second  = String(d.getUTCSeconds()).padStart(2, "0");

  return `${weekday} ${month} ${day} ${year} ${hour}:${minute}:${second} UTC (Coordinated Universal Time)`;
}

/* RUN SPIN — RESTORED CHARACTER DROPPING */
async function runSpinWheel() {
  if (spinning) return;
  spinning = true;

  results = [];
  document.getElementById("spin-results").textContent = "__ __ __ __ __ __";

  const chars = currentBingoCode.split("");

  for (let i = 0; i < chars.length; i++) {
    const value = chars[i];
    await animateSpin(value);
    results.push(value);

    document.getElementById("spin-results").textContent =
      results.join("   ");
  }

  const bingoCode = results.join("");
  const spinDate = formatReadableUTC();

document.getElementById("bingo-display").textContent = "BINGO: " + bingoCode;
document.getElementById("bingo-date").textContent = "Date: " + spinDate;

localStorage.setItem("lastSpinDate", spinDate);

  /* ALWAYS use displayed spinpooltoken as base */
const baseSpinpool = Number(document.getElementById("spinpooltoken").textContent);

const percent_3  = baseSpinpool * 0.03;
const percent_6  = baseSpinpool * 0.06;
const percent_9  = baseSpinpool * 0.09;
const percent_12 = baseSpinpool * 0.12;
const percent_15 = baseSpinpool * 0.15;
const percent_18 = baseSpinpool * 0.18;
const percent_7  = baseSpinpool * 0.07;

  /* -------------------- INSERT INTO 70percentSQL -------------------- */

await supabaseClient
  .from("70percentSQL")
  .insert({
    spintoken_vol: Number(baseSpinpool.toFixed(4)),
    spin_time: new Date().toISOString(),
    bingo_6_char: bingoCode,
    percent_3: percent_3.toFixed(4),
    percent_6: percent_6.toFixed(4),
    percent_9: percent_9.toFixed(4),
    percent_12: percent_12.toFixed(4),
    percent_15: percent_15.toFixed(4),
    percent_18: percent_18.toFixed(4),
    percent_7: percent_7.toFixed(4)
  });

  const { data: rows, error } = await supabaseClient
    .from("BingoSQL")
    .select("id, crypto_wallet_id, pct_3, pct_6, pct_9, pct_12, pct_15, pct_18, pct_7");

  if (error || !rows) {
    document.getElementById("bingoSQL_display").innerHTML =
      "ERROR reading BingoSQL.";
    spinning = false;
    pauseTimer = false;
    return;
  }
  
  /* -------------------- 3% LOGIC -------------------- */

  const leftMatches = rows.filter(r => r.crypto_wallet_id[0] === matchChar);
  const rightMatches = rows.filter(r => {
    const last = r.crypto_wallet_id[r.crypto_wallet_id.length - 1];
    return last === matchChar;
  });

  const first_left_count = leftMatches.length;
  const first_right_count = rightMatches.length;
  const first_count = first_left_count + first_right_count;

  let pct_3 = 0;
  if (first_count !== 0) {
    pct_3 = percent_3 / first_count;
  }

  let pct3_before = 0;
  if (leftMatches.length > 0 || rightMatches.length > 0) {
    const firstID = leftMatches.length > 0 ? leftMatches[0].id : rightMatches[0].id;
    const { data: beforeData } = await supabaseClient
      .from("BingoSQL")
      .select("pct_3")
      .eq("id", firstID)
      .single();
    pct3_before = Number(beforeData?.pct_3 || 0);
  }

  let pct3_after_left = pct3_before;
  let leftUpdates = [];

  for (const r of leftMatches) {
    const { data } = await supabaseClient
      .from("BingoSQL")
      .select("pct_3")
      .eq("id", r.id)
      .single();

    const dbValue = Number(data?.pct_3 || 0);
    const newValue = Number((dbValue + pct_3).toFixed(3));

    pct3_after_left = newValue;

    leftUpdates.push(
      supabaseClient
        .from("BingoSQL")
        .update({ pct_3: newValue })
        .eq("id", r.id)
    );
  }

  await Promise.all(leftUpdates);

  let pct3_after_right = pct3_after_left;
  let rightUpdates = [];

  for (const r of rightMatches) {
    const { data } = await supabaseClient
      .from("BingoSQL")
      .select("pct_3")
      .eq("id", r.id)
      .single();

    const dbValue = Number(data?.pct_3 || 0);
    const newValue = Number((dbValue + pct_3).toFixed(3));

    pct3_after_right = newValue;

    rightUpdates.push(
      supabaseClient
        .from("BingoSQL")
        .update({ pct_3: newValue })
        .eq("id", r.id)
    );
  }

  await Promise.all(rightUpdates);

  const pct3_final = pct3_after_right;

  /* ⭐ Option B2 Display */
  document.getElementById("bingo-extra").innerHTML =
    "1st_left_count: " + first_left_count + "<br>" +
    "1st_right_count: " + first_right_count + "<br><br>" +

    "Bingo match character: " + matchChar + "<br><br>" +

    "First char on the left = " + matchChar + ":<br>" +
    (first_left_count
      ? leftMatches.map(r =>
          r.crypto_wallet_id + " → pct_3 = + " + pct_3.toFixed(3)
        ).join("<br>")
      : "none") +
    "<br><br>" +

    "Last char on the right = " + matchChar + ":<br>" +
    (first_right_count
      ? rightMatches.map(r =>
          r.crypto_wallet_id + " → pct_3 = + " + pct_3.toFixed(3)
        ).join("<br>")
      : "none") +
    "<br><br>" +

    "pct_3 DB_data before updates: " + pct3_before.toFixed(3) + "<br>" +
    "pct_3 after LEFT add_1: " + pct3_after_left.toFixed(3) + "<br>" +
    "pct_3 after RIGHT add_2: " + pct3_after_right.toFixed(3) + "<br>" +
    "pct_3 final DB_data: " + pct3_final.toFixed(3) + "<br><br>";
  
  spinning = false;
}

/* LOAD NEXT SPIN ROW */
async function loadSpinSQL() {
  const nowUTC = new Date().toISOString();

  const { data, error } = await supabaseClient
    .from("SpinSQL")
    .select("id, next_spin_time, bingo_code, reset_token")
    .gt("next_spin_time", nowUTC)
    .order("next_spin_time", { ascending: true })
    .limit(1);

  if (error || !data || data.length === 0) {
    document.getElementById("timer").textContent = "No more spins";
    timerLoaded = false;
    return;
  }

  const row = data[0];

  globalNextSpinTime = new Date(row.next_spin_time);
  currentBingoCode = row.bingo_code;
  currentResetToken = row.reset_token;

  document.getElementById("spinpooltoken").textContent =
    Number(currentResetToken).toFixed(4);

  timerLoaded = true;
}

/* TIMER */
async function updateTimer() {
  if (!timerLoaded) {
    await loadSpinSQL();
    if (!timerLoaded) return;

    drawWheel();
  }

  const nowUTC = new Date();
  const diff = globalNextSpinTime - nowUTC;

  if (diff <= 0) {
    document.getElementById("timer").textContent = "0m 0s";

    await runSpinWheel();

    timerLoaded = false;
    await loadSpinSQL();

    return;
  }

  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${minutes}m ${seconds}s`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>
