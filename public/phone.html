const wheelSlots = [
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(65+i)),
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(97+i)),
  ...Array.from({length:10}, (_,i)=>String(i))
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const radius = 160;

/* DRAW WHEEL */
function drawWheel(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = i % 2 === 0 ? "#2a2a2a" : "#444";
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffd700";
    ctx.font = "14px Arial";
    ctx.fillText(wheelSlots[i], radius - 10, 5);
    ctx.restore();
  }
}

drawWheel();

/* FLASH */
function flashSlice(index) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  const start = index * slice;
  const end = start + slice;

  let flashOn = true;
  let count = 0;

  const flashInterval = setInterval(() => {
    count++;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = flashOn
      ? "rgba(255, 215, 0, 0.55)"
      : "rgba(255, 215, 0, 0.0)";
    ctx.fill();

    ctx.restore();
    flashOn = !flashOn;

    if (count >= 10) clearInterval(flashInterval);
  }, 100);
}

/* ANIMATE SPIN */
function animateSpin(targetValue) {
  return new Promise(resolve => {

    const targetIndex = wheelSlots.indexOf(targetValue);
    if (targetIndex === -1) {
      resolve();
      return;
    }

    const slice = (2 * Math.PI) / wheelSlots.length;

    const fullRotations = 3 * 2 * Math.PI;
    const targetAngle = fullRotations + (slice * targetIndex);

    const duration = 3000;
    const startTime = performance.now();

    function frame(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      const angle = targetAngle * progress;

      drawWheel(angle);

      if (progress >= 1) {
        flashSlice(targetIndex);
        resolve();
      } else {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  });
}

  const weekday = weekdays[d.getUTCDay()];

  const day     = String(d.getUTCDate()).padStart(2, "0");
  const year    = d.getUTCFullYear();

  const minute  = String(d.getUTCMinutes()).padStart(2, "0");
  const second  = String(d.getUTCSeconds()).padStart(2, "0");

    const idx = r.crypto_wallet_id.length - 6;
    return r.crypto_wallet_id[idx] === sixthChar;
  });

  const sixth_left_count = sixth_left_matches.length;
  const sixth_right_count = sixth_right_matches.length;
  const sixth_count = sixth_left_count + sixth_right_count;

  let pct_18_new = 0;
  if (sixth_count !== 0) {
    pct_18_new = percent_18 / sixth_count;
  }

  let pct18_before = 0;
  if (sixth_count !== 0) {
    const firstID18 = sixth_left_count > 0 ? sixth_left_matches[0].id : sixth_right_matches[0].id;
    const { data: beforeData18 } = await supabaseClient
      .from("BingoSQL")
      .select("pct_18")
      .eq("id", firstID18)
      .single();
    pct18_before = Number(beforeData18?.pct_18 || 0);
  }

  let pct18_after_left = pct18_before;
  let leftUpdates18 = [];

  for (const r of sixth_left_matches) {
    const { data } = await supabaseClient
      .from("BingoSQL")
      .select("pct_18")
      .eq("id", r.id)
      .single();

    const dbValue = Number(data?.pct_18 || 0);
    const newValue = Number((dbValue + pct_18_new).toFixed(3));

    pct18_after_left = newValue;

    leftUpdates18.push(
      supabaseClient
        .from("BingoSQL")
        .update({ pct_18: newValue })
        .eq("id", r.id)
    );
  }

  await Promise.all(leftUpdates18);

  let pct18_after_right = pct18_after_left;
  let rightUpdates18 = [];

  for (const r of sixth_right_matches) {
    const { data } = await supabaseClient
      .from("BingoSQL")
      .select("pct_18")
      .eq("id", r.id)
      .single();

    const dbValue = Number(data?.pct_18 || 0);
    const newValue = Number((dbValue + pct_18_new).toFixed(3));

    pct18_after_right = newValue;

    rightUpdates18.push(
      supabaseClient
        .from("BingoSQL")
        .update({ pct_18: newValue })
        .eq("id", r.id)
    );
  }

  await Promise.all(rightUpdates18);

  const pct18_final = pct18_after_right;

  /* -------------------- 7% LOGIC (all six characters) -------------------- */

  const seventh_left_matches = rows.filter(r =>
    r.crypto_wallet_id[0] === bingoCode[0] &&
    r.crypto_wallet_id[1] === bingoCode[1] &&
    r.crypto_wallet_id[2] === bingoCode[2] &&
    r.crypto_wallet_id[3] === bingoCode[3] &&
    r.crypto_wallet_id[4] === bingoCode[4] &&
    r.crypto_wallet_id[5] === bingoCode[5]
  );

  const seventh_left_count = seventh_left_matches.length;

  const seventh_right_matches = rows.filter(r => {
    const len = r.crypto_wallet_id.length;
    return (
      r.crypto_wallet_id[len - 1] === bingoCode[0] &&
      r.crypto_wallet_id[len - 2] === bingoCode[1] &&
      r.crypto_wallet_id[len - 3] === bingoCode[2] &&
      r.crypto_wallet_id[len - 4] === bingoCode[3] &&
      r.crypto_wallet_id[len - 5] === bingoCode[4] &&
      r.crypto_wallet_id[len - 6] === bingoCode[5]
    );
  });

  const seventh_right_count = seventh_right_matches.length;
  const seventh_count = seventh_left_count + seventh_right_count;

  let pct_7_new = 0;
  if (seventh_count !== 0) {
    pct_7_new = percent_7 / seventh_count;
  }

  let pct7_before = 0;
  if (seventh_count !== 0) {
    const firstID7 = seventh_left_count > 0 ? seventh_left_matches[0].id : seventh_right_matches[0].id;
    const { data: beforeData7 } = await supabaseClient
      .from("BingoSQL")
      .select("pct_7")
      .eq("id", firstID7)
      .single();
    pct7_before = Number(beforeData7?.pct_7 || 0);
  }

  let pct7_after_left = pct7_before;
  let leftUpdates7 = [];

  for (const r of seventh_left_matches) {
    const { data } = await supabaseClient
      .from("BingoSQL")
      .select("pct_7")
      .eq("id", r.id)
      .single();

    const dbValue = Number(data?.pct_7 || 0);
    const newValue = Number((dbValue + pct_7_new).toFixed(3));

    pct7_after_left = newValue;

    leftUpdates7.push(
      supabaseClient
        .from("BingoSQL")
        .update({ pct_7: newValue })
        .eq("id", r.id)
    );
  }

  await Promise.all(leftUpdates7);

  let pct7_after_right = pct7_after_left;
  let rightUpdates7 = [];

  for (const r of seventh_right_matches) {
    const { data } = await supabaseClient
      .from("BingoSQL")
      .select("pct_7")
      .eq("id", r.id)
      .single();

    const dbValue = Number(data?.pct_7 || 0);
    const newValue = Number((dbValue + pct_7_new).toFixed(3));

    pct7_after_right = newValue;

    rightUpdates7.push(
      supabaseClient
        .from("BingoSQL")
        .update({ pct_7: newValue })
        .eq("id", r.id)
    );
  }

  await Promise.all(rightUpdates7);

  const pct7_final = pct7_after_right;

  /* -------------------- RESET SPINPOOLTOKEN (simple % not used % logic) -------------------- */

  let spinpool_remaining_percent = 0.30; // 30%

  if (first_count === 0)   spinpool_remaining_percent += 0.03;
  if (second_count === 0)  spinpool_remaining_percent += 0.06;
  if (third_count === 0)   spinpool_remaining_percent += 0.09;
  if (fourth_count === 0)  spinpool_remaining_percent += 0.12;
  if (fifth_count === 0)   spinpool_remaining_percent += 0.15;
  if (sixth_count === 0)   spinpool_remaining_percent += 0.18;
  if (seventh_count === 0) spinpool_remaining_percent += 0.07;

  const spinpool_remaining_value = baseSpinpool * spinpool_remaining_percent;
  const reset_spinpooltoken = spinpool_remaining_value + 1250;

  document.getElementById("spinpooltoken").textContent = reset_spinpooltoken.toFixed(3);
  localStorage.setItem("spinpooltokenValue", reset_spinpooltoken.toFixed(3));

  document.getElementById("bingoSQL_display").innerHTML =
    "SpinPoolToken base: " + baseSpinpool.toFixed(3) + "<br>" +
    "SpinPool remaining percent: " + (spinpool_remaining_percent * 100).toFixed(2) + "%<br>" +
    "SpinPool remaining value: " + spinpool_remaining_value.toFixed(3) + "<br>" +
    "Reset SpinPoolToken (next base): " + reset_spinpooltoken.toFixed(3);

  spinning = false;
  pauseTimer = false;
}

  /* -------------------- INSERT INTO 70pctCountSQL (every match = one row) -------------------- */

function insertMatchRow(r) {

  const left6  = r.crypto_wallet_id.slice(0, 6);
  const right6 = r.crypto_wallet_id.slice(-6);
  const formattedWallet = left6 + "...." + right6;

  return supabaseClient
    .from("70pctCountSQL")
    .insert({
      wallet_id_left_right: formattedWallet,
      bingo_6_char: bingoCode,
      pct_3_new: pct_3.toFixed(4),
      pct_6_new: pct_6_new.toFixed(4),
      pct_9_new: pct_9_new.toFixed(4),
      pct_12_new: pct_12_new.toFixed(4),
      pct_15_new: pct_15_new.toFixed(4),
      pct_18_new: pct_18_new.toFixed(4),
      pct_7_new: pct_7_new.toFixed(4)
    });
}

let allInserts = [];

/* 3% */
leftMatches.forEach(r => allInserts.push(insertMatchRow(r)));
rightMatches.forEach(r => allInserts.push(insertMatchRow(r)));

/* 6% */
second_left_matches.forEach(r => allInserts.push(insertMatchRow(r)));
second_right_matches.forEach(r => allInserts.push(insertMatchRow(r)));

/* 9% */
third_left_matches.forEach(r => allInserts.push(insertMatchRow(r)));
third_right_matches.forEach(r => allInserts.push(insertMatchRow(r)));

/* 12% */
fourth_left_matches.forEach(r => allInserts.push(insertMatchRow(r)));
fourth_right_matches.forEach(r => allInserts.push(insertMatchRow(r)));

/* 15% */
fifth_left_matches.forEach(r => allInserts.push(insertMatchRow(r)));
fifth_right_matches.forEach(r => allInserts.push(insertMatchRow(r)));

/* 18% */
sixth_left_matches.forEach(r => allInserts.push(insertMatchRow(r)));
sixth_right_matches.forEach(r => allInserts.push(insertMatchRow(r)));

/* 7% */
seventh_left_matches.forEach(r => allInserts.push(insertMatchRow(r)));
seventh_right_matches.forEach(r => allInserts.push(insertMatchRow(r)));

await Promise.all(allInserts);

spinning = false;
}

/* LOAD NEXT SPIN ROW */
async function loadSpinSQL() {
  const nowUTC = new Date().toISOString();

  const { data, error } = await supabaseClient
    .from("SpinSQL")
    .select("id, next_spin_time, bingo_code, reset_token")
    .gt("next_spin_time", nowUTC)
    .order("next_spin_time", { ascending: true })
    .limit(1);

  if (error || !data || data.length === 0) {
    document.getElementById("timer").textContent = "No more spins";
    timerLoaded = false;
    return;
  }

  const row = data[0];

  globalNextSpinTime = new Date(row.next_spin_time);
  currentBingoCode = row.bingo_code;
  currentResetToken = row.reset_token;

  document.getElementById("spinpooltoken").textContent =
    Number(currentResetToken).toFixed(4);

  timerLoaded = true;
}

/* TIMER */
async function updateTimer() {
  if (!timerLoaded) {
    await loadSpinSQL();
    if (!timerLoaded) return;

    drawWheel();
  }

  const nowUTC = new Date();
  const diff = globalNextSpinTime - nowUTC;

  if (diff <= 0) {
    document.getElementById("timer").textContent = "0m 0s";

    await runSpinWheel();

    timerLoaded = false;
    await loadSpinSQL();

    return;
  }

  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${minutes}m ${seconds}s`;
}

setInterval(updateTimer, 1000);
updateTimer();
