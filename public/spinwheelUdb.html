<script>
/* ⭐ PART 2 — 62 characters */
const wheelSlots = [
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(65+i)),
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(97+i)),
  ...Array.from({length:10}, (_,i)=>String(i))
];

let spinPool = [...wheelSlots];
let results = [];
let spinning = false;
let pauseTimer = false;

/* RESTORE DATE + TOKEN */
const savedToken = localStorage.getItem("spinpooltokenValue");
if (savedToken) {
  document.getElementById("spinpooltoken").textContent = savedToken;
}

const savedDate = localStorage.getItem("lastSpinDate");
if (savedDate) {
  document.getElementById("bingo-date").textContent = "Date: " + savedDate;
}

/* CANVAS */
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const radius = 160;

/* DRAW WHEEL */
function drawWheel(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = i % 2 === 0 ? "#2a2a2a" : "#444";
    ctx.fill();
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();

    ctx.save();
    ctx.translate(radius, radius);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffd700";
    ctx.font = "14px Arial";
    ctx.fillText(wheelSlots[i], radius - 10, 5);
    ctx.restore();
  }
}

drawWheel();

/* FLASH */
function flashSlice(index) {
  const slice = (2 * Math.PI) / wheelSlots.length;
  const start = index * slice;
  const end = start + slice;

  let flashOn = true;
  let count = 0;

  const flashInterval = setInterval(() => {
    count++;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, start, end);

    ctx.fillStyle = flashOn
      ? "rgba(255, 215, 0, 0.55)"
      : "rgba(255, 215, 0, 0.0)";
    ctx.fill();

    ctx.restore();
    flashOn = !flashOn;

    if (count >= 10) clearInterval(flashInterval);
  }, 100);
}

/* SPIN ONE */
function spinOne() {
  if (spinPool.length === 0) spinPool = [...wheelSlots];
  const index = Math.floor(Math.random() * spinPool.length);
  const value = spinPool[index];
  spinPool.splice(index, 1);
  return value;
}

/* ANIMATE SPIN */
function animateSpin(targetValue) {
  return new Promise(resolve => {

    const targetIndex = wheelSlots.indexOf(targetValue);
    const slice = (2 * Math.PI) / wheelSlots.length;

    const fullRotations = 3 * 2 * Math.PI;
    const targetAngle = fullRotations + (slice * targetIndex);

    const duration = 3000;
    const startTime = performance.now();

    function frame(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      const angle = targetAngle * progress;

      drawWheel(angle);

      if (progress >= 1) {
        flashSlice(targetIndex);
        resolve();
      } else {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  });
}

/* DISPLAY RESULTS */
function updateResultsDisplay() {
  document.getElementById("spin-results").textContent =
    results.join("   ");
}

/* ⭐ UTC DATE FORMATTER */
function formatUTCDate() {
  const d = new Date();

  const weekdays = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months   = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const weekday = weekdays[d.getUTCDay()];
  const month   = months[d.getUTCMonth()];
  const day     = String(d.getUTCDate()).padStart(2, "0");
  const year    = d.getUTCFullYear();

  const hour    = String(d.getUTCHours()).padStart(2, "0");
  const minute  = String(d.getUTCMinutes()).padStart(2, "0");
  const second  = String(d.getUTCSeconds()).padStart(2, "0");

  return `${weekday} ${month} ${day} ${year} ${hour}:${minute}:${second} (UTC)`;
}

/* ⭐ PART 2 — RUN 6 SPINS */
async function runSpinWheel() {
  if (spinning) return;
  spinning = true;
  pauseTimer = true;

  results = [];
  updateResultsDisplay();

  document.getElementById("bingo-display").textContent = "BINGO:";
  document.getElementById("bingoSQL_display").innerHTML = "";
  document.getElementById("bingo-extra").innerHTML = "";

  for (let i = 0; i < 6; i++) {
    const value = spinOne();
    await animateSpin(value);
    results.unshift(value);
    updateResultsDisplay();
  }

  const bingoCode = results.join("");
  const spinDate = formatUTCDate();

  localStorage.setItem("lastSpinDate", spinDate);
  document.getElementById("bingo-date").textContent = "Date: " + spinDate;

  document.getElementById("bingo-display").textContent =
    "BINGO: " + bingoCode;

  spinning = false;
  pauseTimer = false;
}

/* -------------------- UTC TIMER (SpinSQL) -------------------- */
async function loadSpinSQL() {
  const { data, error } = await supabaseClient
    .from("SpinSQL")
    .select("id, next_spin_time, reset_spinpooltoken")
    .eq("id", 1)
    .single();

  if (error || !data) {
    document.getElementById("timer").textContent = "Timer load error";
    return;
  }

  globalNextSpinTime = new Date(data.next_spin_time);

  const dbToken = Number(data.reset_spinpooltoken).toFixed(4);
  document.getElementById("spinpooltoken").textContent = dbToken;

  timerLoaded = true;
}

async function updateSpinSQLWithNewTime() {
  const nowUTC = new Date();
  const newTime = new Date(nowUTC.getTime() + 5 * 60000);

  await supabaseClient
    .from("SpinSQL")
    .update({ next_spin_time: newTime.toISOString() })
    .eq("id", 1);

  globalNextSpinTime = newTime;
  timerLoaded = true;
}

/* ⭐ PART 1 — AUTO-SPIN WHEN TIMER HITS ZERO */
async function updateTimer() {
  if (!timerLoaded) {
    await loadSpinSQL();
    if (!timerLoaded) return;
  }

  const nowUTC = new Date();
  const diff = globalNextSpinTime - nowUTC;

  if (diff <= 0) {
    document.getElementById("timer").textContent = "0m 0s";

    await updateSpinSQLWithNewTime();
    timerLoaded = false;
    await loadSpinSQL();

    setTimeout(runSpinWheel, 300);   /* ⭐ AUTO-SPIN */

    return;
  }

  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  document.getElementById("timer").textContent =
    `${minutes}m ${seconds}s`;
}

setInterval(updateTimer, 1000);
updateTimer();
</script>
